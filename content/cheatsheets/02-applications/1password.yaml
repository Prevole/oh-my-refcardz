title: 1Password
summary: App-level 1Password setup for developer workflows, especially app integration,
  SSH agent behavior, commit signing, and shell plugin approval.
color: "#145FE4"
icon: 1password

sections:
  - title: Desktop App
    cards:
      - title: Integration and Approval
        items:
          - entries:
              - title: Enable app integration
              - where: Settings > Developer
              - text: Turn on CLI integration so [[op|op]] can reuse the signed-in desktop app and biometric approval instead of requiring a separate manual session flow. This is the base switch that makes the CLI and other local developer workflows feel native instead of bolted on.
              - settings:
                  - App integration = enabled

          - entries:
              - title: Require biometric approval
              - where: Settings > Security
              - text: Keep item reads and SSH key usage behind explicit approval when you want tighter control over local developer actions. A good default when the same machine is used for both development and general browsing.
              - settings:
                  - Touch ID / biometrics = enabled
                  - Confirm before filling or revealing = enabled

  - title: SSH and Git
    cards:
      - title: SSH Agent
        items:
          - entries:
              - title: Enable the built-in SSH agent
              - where: Settings > Developer
              - text: Use 1Password as the single place that stores and serves SSH keys for [[git|Git]] hosts and remote machines. Once enabled, [[git|Git]] and SSH clients can request keys from 1Password instead of relying on a separate `ssh-agent` workflow.
              - settings:
                  - SSH agent = enabled

          - entries:
              - title: Prefer vault-backed SSH keys
              - file: ~/.config/1Password/ssh/agent.toml
              - text: Restrict which vaults or accounts the 1Password SSH agent should expose
                  when you want tighter control than the default behavior.
              - content: |-
                  [[ssh-keys]]
                    vault = "<vault>"
              - text: Useful when you keep personal and work keys separated and want the
                  agent to offer only the relevant set.
            detailedEntries:
              - contentExample: |-
                  [[ssh-keys]]
                    vault = "Engineering"

      - title: Commit Signing
        items:
          - entries:
              - title: Enable Git commit signing from the app
              - where: Developer sidebar > SSH Keys
              - text: 1Password can guide the setup and hold the SSH key used for signed commits so the signing flow stays close to normal [[git|Git]] usage. This app-driven path is often simpler than manually wiring [[git|Git]] and SSH signing from scratch.
              - settings:
                  - Select key
                  - Set up commit signing

          - entries:
              - title: Test SSH auth against GitHub
              - command: ssh -T git@github.com
              - text: Verify that the app-managed SSH agent is serving the expected key
                  before attempting clone, fetch, or push.

  - title: Developer UX
    cards:
      - title: Shell Plugins
        items:
          - entries:
              - title: Enable shell plugin approval
              - where: Settings > Developer
              - text: Shell plugins let supported CLIs fetch credentials from 1Password with approval prompts instead of plaintext API keys in shell profiles. This is especially useful for cloud and infrastructure CLIs that are otherwise configured with long-lived local tokens.
              - settings:
                  - Shell plugins = enabled

      - title: Browser Extension
        items:
          - entries:
              - title: Autofill public keys in the browser
              - where: Browser extension
              - text: When adding SSH keys to GitHub, GitLab, or cloud consoles, let 1Password fill the public key from an SSH key item you already manage. This avoids copy-paste mistakes and keeps the key registration flow connected to the app that manages the private key.
              - settings:
                  - Autofill public keys = enabled
