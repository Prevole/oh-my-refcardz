title: SSH
summary: Fake remote access references for visual testing only.
color: "#90be6d"
icon: ssh

sections:
  - title: Connect
    cards:
      - title: Common Commands
        items:
          - type: command
            title: Connect to host
            command: ssh user@host
            description: Open a remote shell.
          - type: command
            title: Copy key
            command: ssh-copy-id user@host
            description: Install local public key.
          - type: shortcut
            keys:
              - "~."
            description: Force-close stuck SSH session.
