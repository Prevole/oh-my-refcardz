title: Chezmoi
summary: Daily dotfile operations, source-state conventions, and a machine bootstrap flow tailored to a 1Password-backed macOS setup.
color: "#4051B5"
icon: chezmoi

sections:
  - title: Daily Workflow
    cards:
      - title: Inspect and Apply
        items:
          - entries:
              - title: Check pending target changes
              - command: chezmoi status
              - text: Show which managed files differ from the source state before deciding whether to edit, re-add, or apply.

          - entries:
              - title: Review rendered diff
              - command: chezmoi diff
              - text: Inspect exactly what `chezmoi apply` would change on the current machine.

          - entries:
              - title: Apply source state
              - command: chezmoi apply
              - text: Render templates and update managed files in the home directory.
            detailedEntries:
              - commandExample: chezmoi apply -n
              - text: Dry-run mode — show what would change without modifying files.
              - commandExample: chezmoi apply -v
              - text: Verbose mode — print each file as it is applied.
              - commandExample: chezmoi apply -n -v
              - text: Combine both to preview changes in detail.

      - title: Navigate and Edit
        items:
          - entries:
              - title: Jump to the source directory
              - command: chezmoi cd
              - text: Open the source-state repository where `dot_*`, `private_*`, `templates`, and `scripts` live.

          - entries:
              - title: Edit one managed target file
              - command: chezmoi edit <path to target file>
              - text: Open the source file that corresponds to a target path without translating the `chezmoi` naming rules by hand.
            detailedEntries:
              - commandExample: chezmoi edit ~/.zshrc
              - commandExample: chezmoi edit ~/.gitconfig
              - commandExample: chezmoi edit ~/.config/1Password/ssh/agent.toml

          - entries:
              - title: Shell alias
              - alias:
                  content: cm <args>
              - text: The `cm` alias aims to reduce `chezmoi` command to type.
              - commandExample: cm status
              - commandExample: cm apply

      - title: Update and Sync
        items:
          - entries:
              - title: Pull and apply upstream changes
              - command: chezmoi update
              - text: Fetch the source repo, merge/rebase according to config, and apply the resulting source state in one step.

          - entries:
              - title: Update without applying
              - command: chezmoi update --apply=false
              - text: Refresh the source state first, then inspect with `chezmoi status` or `chezmoi diff` before touching the target machine.

  - title: Source State
    cards:
      - title: Naming Conventions
        items:
          - entries:
              - title: Source-state prefixes and suffixes
              - table:
                  headers:
                    - Prefix/Suffix
                    - Effect
                    - Example
                  rows:
                    - cols:
                        - "`dot_`"
                        - Maps to hidden path
                        - "`dot_zshrc` → `.zshrc`"
                    - cols:
                        - "`private_`"
                        - Restricts permissions (removes group/world)
                        - "`private_ssh/` → `ssh/`"
                    - cols:
                        - "`executable_`"
                        - Preserves executable bit
                        - "`executable_oprc.sh` → `oprc.sh`"
                    - cols:
                        - "`.tmpl`"
                        - Renders as template
                        - "`dot_zshrc.tmpl` → `.zshrc`"
                    - cols:
                        - "`run_`"
                        - Executes as script
                        - "`run_install.sh`"
                    - cols:
                        - "`once_`"
                        - Runs only once (with `run_`)
                        - "`run_once_setup.sh`"
                    - cols:
                        - "`before_` / `after_`"
                        - Script execution order
                        - "`run_once_before_01-setup.sh`"

          - entries:
              - title: Prompted data
              - file: .chezmoi.yaml.tmpl
              - text: >-
                  Use `promptString`, `promptBool`, or `promptChoice` to ask the user
                  for values during `chezmoi init`. Add the `Once` suffix to persist
                  answers in `chezmoi.yaml` and skip future prompts.

      - title: Fixups
        items:
          - entries:
              - title: Re-import a changed target file
              - command: chezmoi re-add <path to target file>
              - text: Update the source state from a file that was edited directly on disk or regenerated locally.
            detailedEntries:
              - commandExample: chezmoi re-add ~/.config/nvim/lazy-lock.json

          - entries:
              - title: Mark a managed file as a template
              - command: chezmoi chattr +template <path to target file>
              - text: Convert an existing managed file to template mode when it needs dynamic data or secret lookups.
            detailedEntries:
              - commandExample: chezmoi chattr +template ~/.config/1Password/ssh/agent.toml

          - entries:
              - title: Find files not yet managed
              - command: chezmoi unmanaged
              - text: List home-directory files that are outside the current source state when deciding what should be brought under management.

          - entries:
              - title: Stop managing a file
              - command: chezmoi forget <path to target file>
              - text: Remove a file from the source state without deleting it from the target machine.
            detailedEntries:
              - commandExample: chezmoi forget ~/.config/some-app/config.json

  - title: Machine Setup
    cards:
      - title: Bootstrap
        items:
          - entries:
              - step: Install Developer Tools
              - command: xcode-select --install
              - text: Install Apple developer tools to make `git` available.
              - step: Configure 1Password
              - text: 1. Create `chezmoi` vault in [[1password|1Password]]
              - text: 2. Create the `GitHub Configuration` note
              - settings:
                  - username
                  - email
                  - name
                  - organisation
              - text: >-
                  Remark: `name` and `organisation` are required for pro setup
              - text: 3. Create the `Git Repositories - <profile>` note
              - contentExample: |-
                  repositories:
                    perso:
                      - url: git@github.com:Prevole/gs-download.git
                      ...
                    work:
                      - name: ...
                        url: ...
                      ...
              - text: The listed repositories will be cloned during the `chezmoi` setup and install
              - step: Clone chezmoi repository
              - command: git clone https://github.com/Prevole/chezmoi.git /tmp/chezmoi
              - text: Clone over HTTPS into `/tmp` — SSH keys are not set up yet.
              - step: Run install script
              - command: /tmp/chezmoi/scripts/mac-setup.sh
              - text: Start the bootstrap flow, see [[#setup-pipeline|setup pipeline]].
              - link:
                  type: github
                  url: https://github.com/Prevole/chezmoi
                  label: Prevole/chezmoi

      - title: Setup Pipeline
        items:
          - entries:
              - anchor: setup-pipeline
              - title: What `mac-setup.sh` runs
              - file: scripts/setup.d/
              - table:
                  headers:
                    - Script
                    - Role
                  rows:
                    - cols:
                        - "`00-profile.sh`"
                        - Choose and persist the machine profile
                    - cols:
                        - "`01-homebrew.sh`"
                        - Install Homebrew
                    - cols:
                        - "`02-machine.sh`"
                        - Configure machine identity
                    - cols:
                        - "`03-1password.sh`"
                        - Sign in to [[1password|1Password]] and `op`
                    - cols:
                        - "`04-ssh-keys.sh`"
                        - Generate and extract temporary SSH keys
                    - cols:
                        - "`05-chezmoi.sh`"
                        - Install `chezmoi` and render the Brewfile
                    - cols:
                        - "`06-apps.sh`"
                        - Run `brew bundle install`
                    - cols:
                        - "`07-directories.sh`"
                        - Create expected directories
                    - cols:
                        - "`08-dotfiles.sh`"
                        - Run `chezmoi init --apply` and restart 1Password
                    - cols:
                        - "`09-mise.sh`"
                        - Install global runtimes with `mise`
                    - cols:
                        - "`10-repos.sh`"
                        - Clone repositories from 1Password
                    - cols:
                        - "`98-ssh-cleanup.sh`"
                        - Delete temporary private keys from disk
              - text: >-
                  The setup is intentionally split into sourced steps so the
                  machine bootstrap stays resumable and easier to reason about.

          - entries:
              - title: Profile persistence
              - file: ~/.config/chezmoi/chezmoi.yaml
              - text: >-
                  The selected profile is written once and reused on later
                  `chezmoi apply` runs so `promptChoiceOnce` does not ask
                  again.

  - title: Contextual Helpers
    cards:
      - title: Related Workflows
        items:
          - entries:
              - title: Secrets in templates
              - text: Secret-backed templates in this setup rely on [[op|op]] and [[1password|1Password]] rather than committed plaintext values.

          - entries:
              - title: Project-local secrets with direnv
              - text: Use [[direnv|direnv]] when a project needs runtime environment variables resolved from [[1password|1Password]] instead of host-level dotfiles.
