title: Git
summary: Personal Git aliases from local config, from quick shorthands to shell helpers.
color: "#00bcd4"
icon: git

sections:
  - title: Inspect and Diff
    cards:
      - title: Working Tree
        items:
          - type: command
            title: Status
            command: git status
            aliases:
              - s
              - st
              - sta
              - stat
            description: Show branch state, staged changes, unstaged edits, and untracked files.

          - type: command
            title: Diff
            command: git diff
            aliases:
              - d
            description: Review unstaged changes.

          - type: command
            title: Cached Diff
            command: git diff --cached
            aliases:
              - dc
            description: Review staged changes before commit.

      - title: Fancy Diff Helpers
        items:
          - type: command
            title: Diff So Fancy
            command: '!f() { [ -z "$GIT_PREFIX" ] || cd "$GIT_PREFIX" && git diff --color "$@" | diff-so-fancy  | less --tabs=4 -RFX; }; f'
            aliases:
              - dsf
            description: Pretty diff pager preserving repo-relative paths.

          - type: command
            title: Cached Diff So Fancy
            command: '!f() { [ -z "$GIT_PREFIX" ] || cd "$GIT_PREFIX" && git diff --cached --color "$@" | diff-so-fancy  | less --tabs=4 -RFX; }; f'
            aliases:
              - dsfc
            description: Pretty pager for staged diffs.

  - title: Branching and Commits
    cards:
      - title: Branch Moves
        items:
          - type: command
            title: Checkout
            command: git checkout
            aliases:
              - co
            description: Legacy shorthand for switching branches or restoring files.

          - type: command
            title: Branch
            command: git branch
            aliases:
              - b
            description: Short alias for branch operations.

      - title: Stage and Commit
        items:
          - type: command
            title: Add All
            command: git add .
            aliases:
              - a
            description: Stage all changes from the current directory.

          - type: command
            title: Commit Message
            command: git commit -m
            aliases:
              - ci
            description: Commit with an inline message.

          - type: command
            title: Amend Commit
            command: git commit --amend
            aliases:
              - ca
            description: Amend the last commit.

  - title: History and Inspection
    cards:
      - title: Log Views
        items:
          - type: command
            title: Graph Log
            command: "git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit"
            aliases:
              - g
            description: Compact decorated graph view of recent history.

          - type: command
            title: Graph Log All
            command: "git log --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit --all"
            aliases:
              - ga
            description: Same graph view across all refs.

          - type: command
            title: Oneline Graph All
            command: git log --oneline --graph --decorate --all
            aliases:
              - graph
            description: Simpler all-branches graph view.

      - title: Config and Files
        items:
          - type: command
            title: Show Local Git Config
            command: cat .git/config
            aliases:
              - info
              - i
            description: Print the repository local Git config.

          - type: command
            title: Edit Local Git Config
            command: '!$EDITOR .git/config'
            aliases:
              - ei
            description: Open the repository local Git config in the current editor.

          - type: command
            title: List Directory
            command: '!eza -la --sort=modified'
            aliases:
              - l
            description: Handy repo-local file listing sorted by modification time.

  - title: Remote and Cleanup
    cards:
      - title: Sync and Push
        items:
          - type: command
            title: Push and Track HEAD
            command: git push -u origin HEAD
            aliases:
              - fp
            description: Push the current branch and set upstream tracking.

          - type: command
            title: Force Push With Lease
            command: git push --force-with-lease
            aliases:
              - pf
            description: Safer force push that checks remote state first.

          - type: command
            title: Pull Rebase
            command: git pull --rebase
            aliases:
              - pull
            description: Pull while replaying local commits on top.

          - type: command
            title: Push Then Tags
            command: '!git push && git push --tags'
            aliases:
              - pt
            description: Push commits first, then push tags.

      - title: Merged Branch Cleanup
        items:
          - type: command
            title: List Cleanable Branches
            command: '!f() { git fetch --prune && git branch --merged | grep -Ev "(^\\*|master|main|dev)"; }; f'
            aliases:
              - lcb
            description: List merged branches except protected names.

          - type: command
            title: Delete Cleanable Branches
            command: '!f() { git fetch --prune && git branch --merged | grep -Ev "(^\\*|master|main|dev)" | xargs git branch -d; }; f'
            aliases:
              - cb
            description: Delete merged branches except protected names.
