title: HTTPie
summary: Synthetic API command examples for category scaling.
color: "#118ab2"
icon: httpie

sections:
  - title: Requests
    cards:
      - title: API basics
        items:
          - type: command
            title: GET endpoint
            command: http GET https://example.com/api/status
            description: Perform a simple GET request.
          - type: command
            title: POST JSON
            command: http POST https://example.com/api/users name=Sam role=admin
            description: Send key-value JSON payload.
