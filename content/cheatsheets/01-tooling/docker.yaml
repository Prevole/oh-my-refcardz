title: Docker
summary: Containers, images, and compose commands you actually use.
color: "#4cc9f0"
icon: docker

sections:
  - title: Containers
    cards:
      - title: Inspect and monitor
        items:
          - type: command
            title: List running containers
            command: docker ps
            description: Quick health check of active containers.

          - type: command
            title: List all containers
            command: docker ps -a
            description: Includes stopped containers for debugging.

          - type: command
            title: Follow container logs
            command: docker logs -f <id>
            description: Stream logs in real time.
            examples:
              - docker logs -f a1b2c3d4e5f6

          - type: command
            title: Inspect container metadata
            command: docker inspect <id>
            description: Full JSON config, mounts, network, and environment.
            examples:
              - docker inspect a1b2c3d4e5f6

          - type: command
            title: Show resource usage
            command: docker stats
            description: Live CPU, memory, and network usage for running containers.

      - title: Lifecycle
        items:
          - type: command
            title: Open shell in container
            command: docker exec -it <id> sh
            description: Inspect files and runtime state.
            examples:
              - docker exec -it a1b2c3d4e5f6 sh

          - type: command
            title: Stop container
            command: docker stop <id>
            description: Send SIGTERM and wait for graceful shutdown.
            examples:
              - docker stop a1b2c3d4e5f6

          - type: command
            title: Remove container
            command: docker rm <id>
            description: Delete a stopped container.
            examples:
              - docker rm a1b2c3d4e5f6

          - type: command
            title: Stop and remove
            command: docker rm -f <id>
            description: Force stop and delete in one command.
            examples:
              - docker rm -f a1b2c3d4e5f6

          - type: command
            title: Prune stopped containers
            command: docker container prune
            description: Remove all stopped containers at once.

  - title: Images
    cards:
      - title: Build and tag
        items:
          - type: command
            title: Build image
            command: docker build -t <image> .
            description: Create an image from current Dockerfile.
            examples:
              - docker build -t my-app:latest .

          - type: command
            title: Build with custom Dockerfile
            command: docker build -f <file> -t <image> .
            description: Use an alternate Dockerfile path.
            examples:
              - docker build -f Dockerfile.prod -t my-app:prod .

          - type: command
            title: Tag an existing image
            command: docker tag <source> <target>
            description: Add a new name or registry prefix to an image.
            examples:
              - docker tag my-app:latest registry.example.com/my-app:latest

          - type: command
            title: Push image to registry
            command: docker push <image>
            description: Upload a tagged image to a remote registry.
            examples:
              - docker push registry.example.com/my-app:latest

      - title: Inspect and clean
        items:
          - type: command
            title: List local images
            command: docker images
            description: Review tags and sizes before cleanup.

          - type: command
            title: Pull image
            command: docker pull <image>
            description: Download a specific image from a registry.
            examples:
              - docker pull node:20-alpine

          - type: command
            title: Remove image
            command: docker rmi <image>
            description: Delete an image by name or ID.
            examples:
              - docker rmi my-app:latest

          - type: command
            title: Prune dangling images
            command: docker image prune
            description: Clean untagged image layers.

          - type: command
            title: Prune all unused images
            command: docker image prune -a
            description: Remove every image not used by a container.

  - title: Compose
    cards:
      - title: Stack lifecycle
        items:
          - type: command
            title: Start services
            command: docker compose up -d
            description: Launch full stack in detached mode.

          - type: command
            title: Start and rebuild
            command: docker compose up -d --build
            description: Rebuild images before starting services.

          - type: command
            title: Stop and remove services
            command: docker compose down
            description: Tear down network and containers.

          - type: command
            title: Stop and remove with volumes
            command: docker compose down -v
            description: Also delete named volumes — useful for a clean slate.

          - type: command
            title: Restart a service
            command: docker compose restart <service>
            description: Restart one service without touching the others.
            examples:
              - docker compose restart api

      - title: Debug and inspect
        items:
          - type: command
            title: Follow service logs
            command: docker compose logs -f
            description: Watch logs across all services.

          - type: command
            title: Follow one service logs
            command: docker compose logs -f <service>
            description: Tail logs for a single service.
            examples:
              - docker compose logs -f api

          - type: command
            title: Open service shell
            command: docker compose exec <service> sh
            description: Run commands inside one service.
            examples:
              - docker compose exec api sh

          - type: command
            title: List compose services
            command: docker compose ps
            description: Show running state of all services in the stack.

          - type: command
            title: Run one-off command
            command: docker compose run --rm <service> <cmd>
            description: Spin up a temporary container and remove it after.
            examples:
              - docker compose run --rm api npm run migrate
