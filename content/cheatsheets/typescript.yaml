title: TypeScript
summary: Practical type system tools for app code.
color: "#9381ff"

sections:
  - title: Type Basics
    cards:
      - title: Type aliases and interfaces
        items:
          - type: shortcut
            keys:
              - type
            description: Compose aliases, unions, and mapped types

          - type: shortcut
            keys:
              - interface
            description: Describe object shape and contracts

          - type: shortcut
            keys:
              - keyof
            description: Create a union of an object's keys

          - type: shortcut
            keys:
              - typeof
            description: Derive a type from a runtime value

          - type: shortcut
            keys:
              - ReturnType<T>
            description: Extract the return type of a function

          - type: shortcut
            keys:
              - Parameters<T>
            description: Extract the parameter types of a function as a tuple

      - title: Generics
        items:
          - type: shortcut
            keys:
              - "<T>"
            description: Declare a generic type parameter

          - type: shortcut
            keys:
              - "T extends U"
            description: Constrain a generic to a subtype

          - type: shortcut
            keys:
              - "T extends keyof U"
            description: Constrain generic to the keys of another type

          - type: shortcut
            keys:
              - "infer R"
            description: Infer a type inside a conditional type expression

  - title: Utility Types
    cards:
      - title: Object shape
        items:
          - type: shortcut
            keys:
              - "Partial<T>"
            description: Make all fields optional

          - type: shortcut
            keys:
              - "Required<T>"
            description: Make all fields required

          - type: shortcut
            keys:
              - "Readonly<T>"
            description: Prevent mutation of all fields

          - type: shortcut
            keys:
              - "Pick<T, K>"
            description: Select a subset of keys from a type

          - type: shortcut
            keys:
              - "Omit<T, K>"
            description: Exclude specific keys from a type

          - type: shortcut
            keys:
              - "Record<K, V>"
            description: Map a set of keys to a value type

      - title: Union and conditional
        items:
          - type: shortcut
            keys:
              - "Exclude<T, U>"
            description: Remove members of U from union T

          - type: shortcut
            keys:
              - "Extract<T, U>"
            description: Keep only members of T that are assignable to U

          - type: shortcut
            keys:
              - "NonNullable<T>"
            description: Remove null and undefined from a type

          - type: shortcut
            keys:
              - "T extends U ? X : Y"
            description: Conditional type — resolves to X or Y based on assignability

  - title: Narrowing
    cards:
      - title: Type guards
        items:
          - type: shortcut
            keys:
              - in
            description: Narrow union by property presence

          - type: shortcut
            keys:
              - instanceof
            description: Narrow by class constructor

          - type: shortcut
            keys:
              - typeof
            description: Narrow primitives (string, number, boolean…)

          - type: shortcut
            keys:
              - "is T"
            description: User-defined type predicate in a guard function

      - title: Exhaustiveness
        items:
          - type: shortcut
            keys:
              - "never"
            description: Mark a branch as unreachable — compiler error if reached

          - type: shortcut
            keys:
              - tagged unions
            description: Branch safely using a shared discriminant field

          - type: shortcut
            keys:
              - "satisfies"
            description: Validate a value against a type without widening it

          - type: shortcut
            keys:
              - "as const"
            description: Infer the narrowest literal type for an object or array

  - title: Advanced Patterns
    cards:
      - title: Mapped types
        items:
          - type: shortcut
            keys:
              - "{ [K in keyof T]: ... }"
            description: Transform each property of a type

          - type: shortcut
            keys:
              - "-?"
            description: Remove optionality from mapped type properties

          - type: shortcut
            keys:
              - "readonly"
            description: Add readonly modifier in mapped type

          - type: shortcut
            keys:
              - "as NewKey"
            description: Remap keys in a mapped type (key remapping)

      - title: Template and string types
        items:
          - type: shortcut
            keys:
              - "`${T}`"
            description: Template literal type — combine string literals

          - type: shortcut
            keys:
              - "Uppercase<T>"
            description: Transform string literal type to uppercase

          - type: shortcut
            keys:
              - "Lowercase<T>"
            description: Transform string literal type to lowercase

          - type: shortcut
            keys:
              - "Capitalize<T>"
            description: Capitalize the first character of a string literal type
