      title: Card A1
      items:
        - entries:
            - command: reset-fixture-a1

  - heading:
      id: section-b
      title: Section B

  - card:
      id: card-b1
      title: Card B1
      items:
        - entries:
            - command: reset-fixture-b1

  - card:
      id: card-b2
      title: Card B2
      items:
        - entries:
            - command: reset-fixture-b2
