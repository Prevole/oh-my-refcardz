title: Layout Persistence Fixture
summary: Synthetic cheatsheet used by E2E tests covering drag-and-drop persistence
  and auto-scroll near viewport edges. The layout is intentionally tall (several
  stacked cards) so the page can be scrolled by ~300px to exercise the auto-scroll
  trigger when dragging near the top edge of the viewport.
color: "#10B981"

