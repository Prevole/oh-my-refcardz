title: Kubectl
summary: Dummy cluster commands to fill the tooling category.
color: "#4895ef"

sections:
  - title: Cluster Peek
    cards:
      - title: Inspect
        items:
          - type: command
            title: List pods
            command: kubectl get pods -A
            description: Show pods across namespaces.
          - type: command
            title: Describe pod
            command: kubectl describe pod <name>
            description: Print pod details and events.
          - type: shortcut
            keys:
              - "-n <ns>"
            description: Scope command to one namespace.
