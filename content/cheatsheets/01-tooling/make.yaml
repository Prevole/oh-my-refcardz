title: Make
summary: Minimal fake targets and patterns for layout previews.
color: "#f4a261"

sections:
  - title: Targets
    cards:
      - title: Daily Use
        items:
          - type: command
            title: Build default target
            command: make
            description: Run the first Makefile target.
          - type: command
            title: Run specific target
            command: make test
            description: Execute a named target.
          - type: shortcut
            keys:
              - "-n"
            description: Print commands without running them.
