title: Ripgrep
summary: Quick fake search commands for dense home rendering.
color: "#e76f51"
icon: rg

sections:
  - title: Search
    cards:
      - title: Text Lookup
        items:
          - type: command
            title: Search pattern
            command: rg "TODO"
            description: Find matches in the project.
          - type: command
            title: Restrict by extension
            command: rg "fetch" -g "*.ts"
            description: Search only TypeScript files.
          - type: shortcut
            keys:
              - "-n"
            description: Show line numbers.
