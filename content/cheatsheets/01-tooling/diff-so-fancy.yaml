title: Diff So Fancy
summary: Readable diff review commands for Git and unified diffs, focused on daily
  inspection rather than Git config.
color: "#2F855A"

sections:
  - title: Basics
    cards:
      - title: What It Is
        items:
          - entries:
              - title: Pipe a diff through diff-so-fancy
              - command: git diff --color | diff-so-fancy
              - text: Render the current unstaged diff with headers, hunk markers, and
                  changed lines formatted for easier scanning.

          - entries:
              - title: Review staged changes
              - command: git diff --cached --color | diff-so-fancy
              - text: Use the same enhanced view for the staged snapshot before creating
                  a commit.

          - entries:
              - title: Unified diff outside Git
              - command: diff -u file_a file_b | diff-so-fancy
              - text: Format any unified diff stream, not just Git output, when comparing
                  two files directly.

      - title: Pager
        items:
          - entries:
              - title: Keep colors in less
              - command: git diff --color | diff-so-fancy | less --tabs=4 -RFX
              - text: Preserve ANSI colors and avoid starting a pager session that feels
                  heavy for short diffs.

          - entries:
              - title: Compare branches
              - command: git diff --color main...HEAD | diff-so-fancy | less --tabs=4 -RFX
              - text: Review everything on the current branch since it diverged from
                  `main` with the enhanced formatter.

  - title: Daily Review Flow
    cards:
      - title: Common Commands
        items:
          - entries:
              - title: Show a single commit
              - command: git show --color HEAD~1 | diff-so-fancy | less --tabs=4 -RFX
              - text: Inspect one commit with readable hunk separation and more obvious
                  filename transitions.

          - entries:
              - title: Review a file only
              - command: git diff --color -- src/app/page.tsx | diff-so-fancy | less --tabs=4 -RFX
              - text: Limit the review to one path when you want focused output during a
                  larger change.

          - entries:
              - title: Compare two commits
              - command: git diff --color abc123 def456 | diff-so-fancy | less --tabs=4 -RFX
              - text: Format the exact delta between two revisions while keeping the
                  command compatible with normal Git diff arguments.
