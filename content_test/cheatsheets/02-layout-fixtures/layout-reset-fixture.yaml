title: Layout Reset Fixture
summary: Synthetic cheatsheet used by E2E tests covering the Phase D reset-to-original
  flow. The structure mirrors heading-nav-fixture so we can seed a known diverging
  layout via localStorage and verify the reset button appears and restores
  the original positions.
color: "#F59E0B"

