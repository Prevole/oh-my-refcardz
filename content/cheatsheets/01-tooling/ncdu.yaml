title: NCDU
summary: Fake disk usage commands for extra tiles.
color: "#06d6a0"
icon: ncdu

sections:
  - title: Disk
    cards:
      - title: Space checks
        items:
          - type: command
            title: Scan current directory
            command: ncdu .
            description: Inspect folder sizes.
          - type: command
            title: Scan root quickly
            command: ncdu -x /
            description: Stay on one filesystem.
