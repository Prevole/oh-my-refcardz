title: Tmux
summary: Fake shortcuts and commands to stress the home layout.
color: "#8ecae6"
icon: tmux

sections:
  - title: Session Basics
    cards:
      - title: Quick Ops
        items:
          - type: command
            title: List sessions
            command: tmux ls
            description: Display existing sessions.
          - type: command
            title: New session
            command: tmux new -s demo
            description: Start a named session.
          - type: shortcut
            keys:
              - "prefix + d"
            description: Detach current session.
